name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: index.html の静的検査
        run: python scripts/check.py
      - name: JavaScript の構文チェック
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('index.html','utf8');
            const blocks=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!blocks.length){console.error('インラインscriptが見つかりません');process.exit(1);}
            blocks.forEach((b,i)=>{ new Function(b); console.log('  OK   script block '+i+' ('+b.length+' chars)'); });
          "
          node --check sw.js
